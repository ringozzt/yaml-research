<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAML 配置格式来历 · 交互思维导图</title>
<style>
  :root { --bg:#0f1419; --panel:#182028; --line:#2b3642; --text:#d7dee6; --dim:#8b98a5; --acc:#4cc38a; --warn:#f5a524; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:28px 32px 8px; max-width:1100px; margin:0 auto; }
  header h1 { margin:0 0 6px; font-size:24px; }
  header p { margin:0; color:var(--dim); font-size:14px; }
  header a { color:var(--acc); text-decoration:none; }
  #tree { max-width:1100px; margin:0 auto; padding:16px 32px 64px; }
  ul { list-style:none; margin:0; padding-left:22px; border-left:1px solid var(--line); }
  #tree > ul { border-left:none; padding-left:0; }
  li { margin:6px 0; }
  .node { display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:14px; cursor:pointer; user-select:none; }
  .node:hover { border-color:var(--acc); }
  .node .tag { font-size:11px; border-radius:4px; padding:1px 6px; margin-left:8px; vertical-align:1px; }
  .tag-p { background:#123a2a; color:var(--acc); }
  .tag-s { background:#3a2f12; color:var(--warn); }
  .node .caret { color:var(--dim); margin-right:6px; font-size:11px; }
  .collapsed > ul { display:none; }
  .leaf { cursor:default; }
  .leaf:hover { border-color:var(--line); }
  .legend { max-width:1100px; margin:0 auto; padding:0 32px; color:var(--dim); font-size:12px; }
  footer { max-width:1100px; margin:0 auto; padding:0 32px 40px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>YAML 配置格式来历 · 交互思维导图</h1>
  <p>点击节点展开 / 折叠 · 数据来源见 <a href="https://github.com/ringozzt/yaml-research">yaml-research 仓库 README</a> · 调研时间 2026-10-21</p>
</header>
<p class="legend"><span class="tag tag-p" style="font-size:11px;border-radius:4px;padding:1px 6px;">P</span> 一手来源（yaml.org / Wikipedia 规范史 / 官方文档）　<span class="tag tag-s" style="font-size:11px;border-radius:4px;padding:1px 6px;">S</span> 二手来源（技术博客与媒体复盘）</p>
<div id="tree"><ul id="root"></ul></div>
<footer>独立第三方调研。内容为 2026-10-21 快照。</footer>
<script>
const T = (t, tag, children) => ({t, tag, c: children || []});
const data = [
  T("名字与后缀", "P", [
    T("官方推荐 .yaml：yaml.org FAQ 自 2006 年明确"),
    T(".yml 是 DOS/Windows 三字符扩展名限制的残留，同 .htm 之于 .html"),
    T("Rails 的 database.yml 把 .yml 习惯钉死；K8s 社区偏 .yaml"),
    T("名字最初是玩笑：Yet Another Markup Language"),
    T("2001 年底改递归缩写：YAML Ain't Markup Language——撇清文档标记，强调数据"),
    T("2024 年 MIME 类型 application/yaml 定稿"),
  ]),
  T("出身（2001）", "P", [
    T("Clark Evans 提出，Ingy döt Net 与 Oren Ben-Kiki 共同设计"),
    T("2001-05-11 Draft 0.1 发在 sml-dev 邮件列表（从 xml-dev 分出、专研简化 XML）"),
    T("初衷：XML 写配置太啰嗦，要一种“长得像人随手会写”的数据格式"),
    T("更早线索：1999 年底 Evans 已讨论代号 YML 的想法；yaml.org 域名 2001-01-05 注册", "S"),
  ]),
  T("设计血统：借来的零件拼装", "P", [
    T("缩进分层 ← Python"),
    T("纯文本序列化 ← Perl 的 Data::Denter（Ingy 本人作品）"),
    T("--- 文档分隔符 ← MIME（RFC 2046）"),
    T("key: value 风格 ← RFC 822 邮件头"),
    T("转义序列 ← C；流式读写 ← SAX"),
    T("评价：零件个个眼熟，整体语义没人能一眼看全——坑的种子"),
  ]),
  T("版本线", "P", [
    T("1.0（2004-01-29）：首个正式规范"),
    T("1.1（2005-01-18）：功能膨胀，布尔规则失控——22 种布尔写法"),
    T("1.2（2009-07-21）：与 JSON 对齐，JSON 成为其子集"),
    T("1.2.2（2021-10-01）：现行版，勘误澄清为主"),
    T("长尾问题：PyYAML 至今默认仍按 1.1 类型规则——规范与实现长期脱节"),
  ]),
  T("扩散链：三级跳", "P", [
    T("2003 Syck（why the lucky stiff）进 Ruby 标准库，YAML 有了主流语言户口", "P"),
    T("2004 Rails database.yml：一代 Web 程序员的配置文件肌肉记忆"),
    T("2012 Ansible playbook：运维/DevOps 圈入坑"),
    T("2014 Kubernetes manifest：加冕——声明式 API 的默认语言"),
    T("Docker Compose / Helm / Kustomize / Argo CD / GitLab CI 全面跟进"),
    T("GitHub Actions：2018 第一版用 HCL，2019 改版换 YAML——最有说服力的一票", "S"),
  ]),
  T("为什么云原生爱它", null, [
    T("真顺手：有注释（JSON 硬伤）、diff 干净可逐行 review（GitOps 的地基）"),
    T("声明式契合：map/list/scalar 1:1 映射 K8s API 对象；--- 一文件多资源"),
    T("对手衬托：XML 啰嗦、TOML 深层嵌套弱、HCL/Jsonnet/CUE 要多学一门语言"),
    T("没得选：全工具链都说 YAML，不用就是跟每个工具和每份文档过不去"),
    T("“资深偏好”相当比例是幸存者经验 + 知道坑在哪 + 有校验工具兜底"),
  ]),
  T("原罪：隐式类型推断", "S", [
    T("挪威问题：country: NO 被 1.1 解析器读成 false（DoorDash 等中过招）"),
    T("on: 键被读成布尔 true:——GitHub Actions 工具链经典坑"),
    T("version: 1.10 → 浮点 1.1，版本号尾零蒸发"),
    T("22:30 → 六十进制整数 1350（1.1）"),
    T("0644：1.1 读八进制 420，1.2 读十进制 644"),
    T("共同点：文件合法、不报错、行为静默地错——最贵的 bug 类型"),
    T("缓解只有纪律：可疑值加引号 + schema 校验"),
  ]),
  T("造反者与缰绳", "S", [
    T("TOML（2013，Tom Preston-Werner）：旗号就是“消灭歧义”，Cargo/Hugo 在用"),
    T("Jsonnet / CUE / HCL：给配置加模板、类型与逻辑——代价是多一门语言"),
    T("KYAML（2025，KEP 5295，K8s SIG CLI）：官方严格子集，强制引号、禁隐式转换"),
    T("信号：连 K8s 都选择“给 YAML 套缰绳”而不是换掉它"),
  ]),
  T("判断", null, [
    T("赢的是时间点（2001 反 XML 风口）+ 载体链（Rails→Ansible→K8s），不是设计最优"),
    T("配置格式界的 QWERTY：人人会背它的坑，全世界的手指已经长成它的形状"),
    T("资深 = 肌肉记忆 + 知道坑埋在哪；爱用一半真顺手、一半生态引力"),
  ]),
];
function render(nodes, parent) {
  const ul = document.createElement("ul");
  nodes.forEach(n => {
    const li = document.createElement("li");
    const div = document.createElement("div");
    const hasKids = n.c && n.c.length > 0;
    div.className = "node" + (hasKids ? "" : " leaf");
    let html = "";
    if (hasKids) html += '<span class="caret">▾</span>';
    html += n.t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    if (n.tag === "P") html += '<span class="tag tag-p">P</span>';
    if (n.tag === "S") html += '<span class="tag tag-s">S</span>';
    div.innerHTML = html;
    li.appendChild(div);
    if (hasKids) {
      render(n.c, li);
      div.addEventListener("click", () => {
        li.classList.toggle("collapsed");
        div.querySelector(".caret").textContent = li.classList.contains("collapsed") ? "▸" : "▾";
      });
    }
    ul.appendChild(li);
  });
  parent.appendChild(ul);
}
render(data, document.getElementById("root"));
</script>
</body>
</html>
